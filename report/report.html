<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>state-matrix</title>
<style>
:root{
  --bg:#fff; --alt:#f7f8fa; --line:#e4e8ee; --line2:#eef1f5;
  --ink:#141922; --mid:#5d6674; --low:#8d96a5;
  --accent:#0a6ed1; --ok:#17855a; --warn:#9a6a10; --bad:#c2372f;
  --warn-bg:#fdf6e8; --bad-bg:#fdf0ef; --ok-bg:#eef8f3; --acc-bg:#eef5fd;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11141a; --alt:#171b22; --line:#2a313c; --line2:#20262f;
  --ink:#e8edf4; --mid:#9aa5b5; --low:#69738400; --low:#697384;
  --accent:#63acf2; --ok:#4cbc8b; --warn:#dca944; --bad:#e8665f;
  --warn-bg:#241e10; --bad-bg:#261513; --ok-bg:#122019; --acc-bg:#111d2c;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);
     -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:1500px;margin:0 auto;padding:0 28px 100px}

/* шапка */
.bar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);
     padding:11px 28px;display:flex;align-items:center;gap:14px}
.bar .nm{font:600 15px var(--sans)}
.bar .sr{font:12px var(--mono);color:var(--low)}
.bar .rt{margin-left:auto;display:flex;align-items:center;gap:10px;font:12px var(--mono);color:var(--low)}
.live{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.live.off{background:var(--bad)}
label.f{display:flex;align-items:center;gap:7px;font:13px var(--sans);color:var(--mid)}
select,input[type=search]{font:14px var(--sans);color:var(--ink);background:var(--alt);
  border:1px solid var(--line);border-radius:8px;padding:6px 10px}
select{cursor:pointer}
input[type=search]{min-width:230px}

/* заголовок документа */
h1{font:650 30px/1.2 var(--sans);letter-spacing:-.02em;margin:30px 0 6px}
.lede{color:var(--mid);font-size:14.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font:11.5px var(--sans);letter-spacing:.02em;text-transform:uppercase;color:var(--mid);
     border:1px solid var(--line);border-radius:5px;padding:2px 8px}

h2{font:650 13px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--low);
   margin:42px 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line);
   display:flex;align-items:baseline;gap:9px}
h2 .c{font:400 13px var(--mono);letter-spacing:0;text-transform:none;color:var(--low)}

/* сводка */
.sum{display:flex;gap:34px;flex-wrap:wrap;margin:22px 0 0;padding:18px 0;
     border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.s{text-align:left}
.s .v{font:650 30px/1 var(--sans);letter-spacing:-.025em;font-variant-numeric:tabular-nums;display:block}
.s .l{font-size:13px;color:var(--low);margin-top:5px;display:block}
.s.warn .v{color:var(--warn)} .s.bad .v{color:var(--bad)} .s.zero .v{color:var(--low)}
.s.fn{margin-left:auto;text-align:right}
.s.fn .v{font:15px/1.8 var(--mono);color:var(--mid)}

/* параметры */
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.p{border:1px solid var(--line);border-radius:11px;padding:15px 17px;background:var(--alt)}
.p .h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.p .n{font:600 15px var(--mono)}
.p .t{font:12px var(--mono);color:var(--low)}
.p .d{color:var(--mid);font-size:13.5px;margin:8px 0 11px}
.p .row{display:flex;gap:7px;align-items:baseline;margin-top:7px;flex-wrap:wrap}
.p .cap{font-size:12px;color:var(--low);flex:none;min-width:88px}
.chip{font:12.5px var(--mono);background:var(--bg);border:1px solid var(--line);
   border-radius:6px;padding:2px 8px;display:inline-block}
.chip.sp{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.p .src{font:11.5px var(--mono);color:var(--low);margin-top:11px;padding-top:10px;
        border-top:1px solid var(--line2);word-break:break-word}
.badge{font:11px var(--sans);color:var(--accent);background:var(--acc-bg);
       border-radius:5px;padding:2px 7px}
.exc{margin-top:16px;font-size:13.5px;color:var(--mid);line-height:1.9}
.exc b{color:var(--ink);font:500 13px var(--mono)}

/* правила */
.rule{display:grid;grid-template-columns:118px 1fr;gap:0 18px;padding:15px 0;
      border-bottom:1px solid var(--line2)}
.rule:last-child{border-bottom:0}
.rule .k{font:12px var(--sans);color:var(--low);padding-top:2px}
.rule .k .st{display:block;margin-top:5px;font:11px var(--sans);
  border-radius:5px;padding:2px 7px;text-align:center}
.rule .k .st.a{background:var(--warn-bg);color:var(--warn)}
.rule .k .st.p{background:var(--ok-bg);color:var(--ok)}
.rule .w{font-size:15px}
.rule .d{color:var(--mid);font-size:13.5px;margin-top:4px}
.rule .m{font:11.5px var(--mono);color:var(--low);margin-top:7px}
.rule.assumed{background:var(--warn-bg);margin:0 -14px;padding:15px 14px;border-radius:9px}

/* состояния */
.tr{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px;align-items:baseline}
.tr .e{font:13px var(--mono);color:var(--ink);white-space:nowrap}
.tr .b{color:var(--mid)}
.tr .b s{text-decoration:none;color:var(--low)}
.tr .b i{font-style:normal;color:var(--accent)}
.tr .b em{font-style:normal;font:11.5px var(--mono);color:var(--low);margin-left:8px}
.init{font:13.5px var(--mono);background:var(--alt);border:1px solid var(--line);
      border-radius:9px;padding:11px 14px;margin-bottom:16px}

.sti{display:grid;grid-template-columns:230px 1fr;gap:0 20px;padding:14px 0;
     border-bottom:1px solid var(--line2)}
.sti:last-child{border-bottom:0}
.sti .l{display:flex;flex-direction:column;gap:4px}
.sti .nm2{font:600 15px var(--sans)}
.sti .cnt{font:12px var(--mono);color:var(--low)}
.sti .cond{font:13px var(--mono);color:var(--mid)}
.sti .cond b{color:var(--ink);font-weight:500}
.sti .d{color:var(--mid);font-size:13.5px;margin-top:5px}
.sti .m{font:11.5px var(--mono);color:var(--low);margin-top:6px}
.sti.none{background:var(--warn-bg);margin:0 -14px;padding:14px;border-radius:9px}
.sti.none .nm2{color:var(--warn)}

/* таблица */
.tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.tw{border:1px solid var(--line);border-radius:11px;overflow:auto;max-height:78vh}
.tw table{min-width:760px}
table{border-collapse:separate;border-spacing:0;width:100%;font:13.5px/1.4 var(--mono);
       table-layout:fixed}
th{position:sticky;top:0;background:var(--bg);text-align:left;padding:11px 14px;
   border-bottom:1px solid var(--line);font:600 12px var(--sans);letter-spacing:.05em;
   text-transform:uppercase;color:var(--mid);white-space:nowrap;z-index:5;cursor:pointer;
   user-select:none}
th:hover{color:var(--ink);background:var(--alt)}
th .ar{color:var(--accent);margin-left:5px}
th.act{color:var(--ink)}
td{padding:9px 14px;border-bottom:1px solid var(--line2);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--alt)}
tr.sel td{background:var(--acc-bg)}
tr.dim td{color:var(--low)}
.star{color:var(--accent);font-weight:600}
td.st2{font:14px var(--sans);color:var(--ink)}
td.st2.no{color:var(--warn);font-weight:500}
td.dsc{font:13.5px var(--sans);color:var(--low)}

/* истории */
.st{padding:11px 0;border-bottom:1px solid var(--line2);font-size:14px}
.st:last-child{border-bottom:0}
.st .vv{font:13px var(--mono)}
.st .pp{color:var(--low);font:12.5px var(--mono);margin-top:3px}
.st .pp b{color:var(--mid);font-weight:400}
.q{background:var(--warn-bg);border-radius:11px;padding:16px 18px;margin-bottom:12px}
.q .ask{font-weight:600;font-size:15px}
.q .g{color:var(--mid);font-size:13.5px;margin-top:5px}
.q .g code{font:12.5px var(--mono)}
.q .cost{color:var(--warn);font-weight:600}
.q .acts{margin-top:11px;display:flex;gap:8px}
.act{border:1px solid var(--line);border-radius:7px;padding:5px 13px;background:var(--bg);font-size:13.5px}
.act:hover{border-color:var(--accent);color:var(--accent)}
.fd{display:grid;grid-template-columns:54px 1fr;gap:0 16px;padding:11px 0;
    border-bottom:1px solid var(--line2);font-size:14px}
.fd:last-child{border-bottom:0}
.fd .n{font:600 15px var(--mono);color:var(--bad);text-align:right}
.fd.warn .n{color:var(--warn)}
.fd .t{color:var(--mid);font-size:13.5px;margin-top:3px}

/* панель */
.dr{position:fixed;top:0;right:0;width:min(440px,94vw);height:100vh;background:var(--bg);
    border-left:1px solid var(--line);z-index:60;transform:translateX(100%);
    transition:transform .16s ease;overflow:auto;padding:20px 22px 60px}
.dr.on{transform:none}
.dr h3{margin:0 0 14px;font:600 16px var(--sans)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font:13.5px var(--mono)}
.kv .k{color:var(--low)}
.sec{margin-top:22px}
.sec h4{margin:0 0 9px;font:600 11.5px var(--sans);letter-spacing:.07em;
        text-transform:uppercase;color:var(--low)}
.box{font-size:14px;color:var(--mid);border-left:2px solid var(--line);padding:3px 0 3px 12px}
.box.w{border-color:var(--warn);color:var(--warn)}
.box code{font:12px var(--mono);color:var(--low);display:block;margin-top:3px}
.step{display:grid;grid-template-columns:18px 1fr;gap:0 9px;font-size:13.5px}
.step .no{color:var(--low);font:12px var(--mono);line-height:1.7}
.step .ev{font:13.5px var(--mono)}
.step .ch{font:12.5px var(--mono);color:var(--mid)}
.step .ch s{text-decoration:none;color:var(--low)}
.step .ch i{font-style:normal;color:var(--accent)}
.step .wh{font:11.5px var(--mono);color:var(--low);padding-bottom:10px}
.scrim{position:fixed;inset:0;background:#0005;z-index:50;display:none}
.scrim.on{display:block}
.empty{padding:34px;text-align:center;color:var(--low);font:14px var(--sans)}
</style>
</head>
<body>

<div class="bar">
  <span class="nm" id="nm">—</span>
  <span class="sr" id="sr"></span>
  <label class="f">окружение <select id="env"></select></label>
  <span class="rt"><span class="live" id="live" title="обновляется само"></span><span id="gen"></span></span>
</div>

<div class="wrap">
  <h1 id="sys">—</h1>
  <div class="lede" id="lede"></div>
  <div class="sum" id="sum"></div>

  <h2>Параметры <span class="c" id="c-p"></span></h2>
  <div class="params" id="params"></div>
  <div class="exc" id="exc"></div>

  <h2>Правила <span class="c" id="c-r"></span></h2>
  <div id="rules"></div>

  <h2>Состояния системы <span class="c" id="c-t"></span></h2>
  <div id="states"></div>

  <h2>Матрица <span class="c" id="c-m"></span></h2>
  <div class="tools">
    <label class="f">показать <select id="filter"></select></label>
    <input type="search" id="q" placeholder="поиск: value=text preview">
    <span class="c" id="hint" style="color:var(--low);font:12.5px var(--mono)"></span>
  </div>
  <div class="tw"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>

  <div id="tail"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="dr" id="dr"></aside>

<script>
const S={data:null,env:0,filter:'all',q:'',sel:null,sort:null,dir:1};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const $=i=>document.getElementById(i);
const sl=()=>S.data.slices[S.env];
const RU={described:'описано',undefined:'не описано',unreachable:'недостижимо',
  contradictory:'противоречие',special:'спецзначения',all:'все строки',
  UNDEFINED:'поведение не описано',UNREACHABLE:'недостижимые комбинации',
  RULE_OVERLAP:'правила пересекаются',CONTRADICTORY:'противоречия',NONDET:'недетерминизм',
  DEAD_END:'тупики',INVALID_EDGE:'переход в запрет',BAD_INITIAL:'плохое начальное состояние',
  MODEL_INCOMPLETE:'модель неполна',CEILING:'превышен потолок'};
const ru=k=>RU[k]||k;
const pl=(n,a,b,c)=>{const m=n%100,d=n%10;return m>=11&&m<=14?c:d===1?a:d>=2&&d<=4?b:c};

async function load(){S.data=await(await fetch('result.json?'+Date.now())).json();render()}

function render(){
  const d=S.data,s=sl(),c=s.counts,P=d.params;
  $('nm').textContent=d.system; $('sr').textContent=d.source;
  $('sys').textContent=d.system;
  $('gen').textContent=d.generated_at.replace('T',' ').slice(5);
  $('env').innerHTML=d.slices.map((x,i)=>{
    const t=Object.entries(x.env).map(([k,v])=>`${k} = ${v}`).join(', ')||'единственное';
    return `<option value="${i}" ${i===S.env?'selected':''}>${esc(t)}</option>`}).join('');
  $('env').onchange=e=>{S.env=+e.target.value;S.sel=null;render()};

  $('lede').innerHTML=`<span class="tag">${d.mode==='spec'?'по спеке':'по коду'}</span>
    <span>${esc(d.source)}</span>
    ${d.slices.length>1?`<span class="tag">окружений ${d.slices.length}</span>`:''}`;

  const cnt={all:s.rows.length};s.rows.forEach(r=>cnt[r.status]=(cnt[r.status]||0)+1);
  const nq=s.questions.filter(q=>!q.answered).length;
  const nb=s.findings.filter(f=>f.severity==='block'&&f.class!=='UNDEFINED').length;
  $('sum').innerHTML=[
    {v:c.collapsed,l:pl(c.collapsed,'строка','строки','строк')+' матрицы'},
    {v:cnt.undefined||0,l:'без описания',t:'warn'},
    {v:nq,l:pl(nq,'вопрос','вопроса','вопросов')+' без ответа',t:'warn'},
    {v:nb,l:pl(nb,'конфликт','конфликта','конфликтов')+' в модели',t:'bad'},
    {v:c.specials,l:'вне матрицы'},
  ].map(x=>`<div class="s ${x.v?(x.t||''):'zero'}">
      <span class="v">${x.v}</span><span class="l">${x.l}</span></div>`).join('')
    +`<div class="s fn"><span class="v">${s.funnel.map(f=>f.count).join(' → ')}</span>
      <span class="l">из ${c.total} комбинаций осталось ${c.collapsed} строк</span></div>`;

  // параметры
  const all=d.param_order.concat(d.env_order);
  $('c-p').textContent=`${all.length} шт`;
  $('params').innerHTML=all.map(n=>{const p=P[n]||{};
    return `<div class="p">
      <div class="h"><span class="n">${esc(n)}</span><span class="t">${esc(p.type||'—')}</span>
        ${p.env?'<span class="badge">окружение</span>':''}
        ${p.catalog?`<span class="badge">${esc(p.catalog)}</span>`:''}</div>
      ${p.desc?`<div class="d">${esc(p.desc)}</div>`:''}
      <div class="row"><span class="cap">значения</span><span>${
        (p.values||[]).map(v=>`<span class="chip">${esc(v)}</span>`).join(' ')}</span></div>
      ${p.special?`<div class="row"><span class="cap">вне матрицы</span><span>${
        p.special.map(v=>`<span class="chip sp">${esc(v)}</span>`).join(' ')}</span></div>`:''}
      <div class="src">${esc(p.from||'—')}</div></div>`}).join('');
  $('exc').innerHTML=d.excluded&&Object.keys(d.excluded).length
    ? '<b style="color:var(--low);font:400 13px var(--sans)">исключено из модели:</b> '
      +Object.entries(d.excluded).map(([k,v])=>`<b>${esc(k)}</b> — ${esc(v)}`).join(' · '):'';

  // правила
  $('c-r').textContent=`${s.rules.length} шт`;
  $('rules').innerHTML=s.rules.map(r=>`<div class="rule ${r.status==='proven'?'':'assumed'}">
      <div class="k">${r.kind}<span class="st ${r.status==='proven'?'p':'a'}">${
        r.status==='proven'?'доказано':'не подтверждено'}</span></div>
      <div><div class="w">${esc(r.what)}</div>
        ${r.desc?`<div class="d">${esc(r.desc)}</div>`:''}
        <div class="m">${esc(r.effect)} · ${r.rows} ${pl(r.rows,'комбинация','комбинации','комбинаций')}
          · ${esc(r.evidence)}</div></div></div>`).join('')
    ||'<div class="empty">правил нет — матрица полная</div>';

  // состояния системы
  const sts=s.states||[];
  $('c-t').textContent=`${sts.length} ${pl(sts.length,'состояние','состояния','состояний')}`
    +(s.no_state?` · ${s.no_state} ${pl(s.no_state,'строка','строки','строк')} без состояния`:'');
  $('states').innerHTML=sts.map(st=>`<div class="sti">
      <div class="l"><span class="nm2">${esc(st.name)}</span>
        <span class="cnt">${st.rows} ${pl(st.rows,'строка','строки','строк')}</span></div>
      <div class="r"><div class="cond">${Object.entries(st.when).map(([k,v])=>
          `${esc(k)} = <b>${esc(Array.isArray(v)?v.join(' / '):v)}</b>`).join(' · ')||'всегда'}</div>
        ${st.desc?`<div class="d">${esc(st.desc)}</div>`:''}
        <div class="m">${esc(st.evidence)}</div></div></div>`).join('')
    +(s.no_state?`<div class="sti none"><div class="l">
        <span class="nm2">без состояния</span>
        <span class="cnt">${s.no_state} ${pl(s.no_state,'строка','строки','строк')}</span></div>
      <div class="r"><div class="cond">ни одно описанное состояние не подошло</div>
        <div class="d">Эти строки видны в матрице пустой колонкой «состояние».
          Либо состояние забыли описать, либо комбинация не должна возникать.</div></div></div>`:'');

  // управление таблицей
  $('c-m').textContent=`${c.collapsed} ${pl(c.collapsed,'строка','строки','строк')}`;
  $('filter').innerHTML=['all','undefined','unreachable','described','contradictory']
    .filter(k=>cnt[k]).map(k=>`<option value="${k}" ${S.filter===k?'selected':''}>${ru(k)} · ${cnt[k]}</option>`).join('')
    +`<option value="special" ${S.filter==='special'?'selected':''}>спецзначения · ${s.specials.length}</option>`;
  $('filter').onchange=e=>{S.filter=e.target.value;render()};
  $('q').value=S.q;
  $('q').oninput=e=>{S.q=e.target.value;table();$('q').focus()};
  $('hint').textContent=S.sort?`сортировка: ${S.sort==='__st'?'состояние':S.sort} ${
    S.dir>0?'по порядку значений':'в обратном порядке'} — третий клик снимает`
                              :'клик по заголовку — сортировка';
  table(); tail(); drawer();
}

function tail(){
  const s=sl();
  const other=s.findings.filter(f=>f.class!=='UNDEFINED');
  const g={};other.forEach(f=>{(g[f.class]=g[f.class]||{n:0,m:f.message,s:f.severity}).n++});
  $('tail').innerHTML=Object.keys(g).length
    ? `<h2>Находки</h2>`+Object.entries(g).map(([k,v])=>
        `<div class="fd ${v.s==='block'?'':'warn'}"><span class="n">${v.n}</span>
         <span><b>${ru(k)}</b><div class="t">${esc(v.m)}</div></span></div>`).join('')
    : '';
}

function rows(){
  const s=sl(),P=S.data.params;
  let r=s.rows;
  if(S.filter!=='all'&&S.filter!=='special')r=r.filter(x=>x.status===S.filter);
  if(S.q.trim()){const t=S.q.trim().toLowerCase().split(/\s+/);
    r=r.filter(x=>t.every(z=>{const[k,v]=z.split('=');
      return v?String(x.values[k]??'').toLowerCase().includes(v)
              :JSON.stringify(x.values).toLowerCase().includes(z)}))}
  if(S.sort){
    const col=S.sort;
    const ord=col.startsWith('__')?null:(P[col]?.values||[]).map(String);
    r=[...r].sort((a,b)=>{
      const av=col==='__st'?(a.state||'яяя'):String(a.values[col]);
      const bv=col==='__st'?(b.state||'яяя'):String(b.values[col]);
      if(ord){const ai=av==='*'?999:ord.indexOf(av),bi=bv==='*'?999:ord.indexOf(bv);
        return (ai-bi)*S.dir}
      return av.localeCompare(bv,'ru')*S.dir});
  }
  return r;
}

function widths(){
  // ширины в ch по самому длинному значению: не зависят от сортировки и фильтра
  const d=S.data,s=sl(),cols=d.param_order,w={};
  cols.forEach(c=>{
    const vs=(d.params[c]?.values||[]).map(String).concat([c]);
    w[c]=Math.max(...vs.map(v=>v.length))+4;
  });
  const st=Math.max(14,...(s.states||[]).map(x=>x.name.length),'не определено'.length)+3;
  return {w,st};
}

function table(){
  const d=S.data,s=sl(),cols=d.param_order,{w,st}=widths();
  $('thead').innerHTML='<colgroup>'
    +cols.map(c=>`<col style="width:${w[c]}ch">`).join('')
    +`<col style="width:${st}ch"><col></colgroup><tr>`
    +cols.map(c=>`<th data-s="${c}" class="${S.sort===c?'act':''}" title="${esc(c)}">${esc(c)}${
      S.sort===c?`<span class="ar">${S.dir>0?'↑':'↓'}</span>`:''}</th>`).join('')
    +`<th data-s="__st" class="${S.sort==='__st'?'act':''}">состояние${
      S.sort==='__st'?`<span class="ar">${S.dir>0?'↑':'↓'}</span>`:''}</th>`
    +`<th>что происходит</th></tr>`;
  $('thead').querySelectorAll('th').forEach(th=>th.onclick=()=>{
    const k=th.dataset.s; if(!k)return;
    if(S.sort!==k){S.sort=k;S.dir=1}else if(S.dir===1){S.dir=-1}else{S.sort=null;S.dir=1}
    render();});

  if(S.filter==='special'){
    $('tbody').innerHTML=s.specials.map(x=>
      `<tr><td colspan="${cols.length}">${esc(x.param)} = <b>${esc(x.value)}</b></td>
       <td class="st2">отдельная проверка</td>
       <td class="dsc">остальные параметры в значениях по умолчанию</td></tr>`).join('');
    return;}
  const rs=rows();
  $('tbody').innerHTML=rs.length?rs.map(r=>
    `<tr data-id="${r.id}" class="${r.status==='unreachable'?'dim':''}${S.sel===r.id?' sel':''}">`
    +cols.map(c=>`<td>${r.values[c]==='*'?'<span class="star">∗</span>':esc(r.values[c])}</td>`).join('')
    +`<td class="st2 ${r.state?'':'no'}">${r.state?esc(r.state):'не определено'}</td>
      <td class="dsc" title="${esc(r.outcome||'')}">${esc(r.outcome||'')}</td></tr>`).join('')
    :`<tr><td colspan="99"><div class="empty">ничего не найдено</div></td></tr>`;
  $('tbody').querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>{S.sel=tr.dataset.id;render()});
}

function drawer(){
  const dr=$('dr'),sc=$('scrim'),r=sl().rows.find(x=>x.id===S.sel);
  if(!r){dr.className='dr';sc.className='scrim';return}
  dr.className='dr on';sc.className='scrim on';
  const cols=S.data.param_order.concat(S.data.env_order);
  dr.innerHTML=`<h3>${ru(r.status)}${r.covers>1?` · ${r.covers} ${
      pl(r.covers,'комбинация','комбинации','комбинаций')}`:''}</h3>
    <div class="kv">${cols.map(c=>{const v=r.values[c],det=r.collapsed&&r.collapsed[c];
      return `<span class="k">${esc(c)}</span><span>${v==='*'
        ?`<span class="star">∗</span> ${det?esc(det.join(', ')):''}`:esc(v)}</span>`}).join('')}</div>
    <div class="sec"><h4>состояние</h4>${r.state?`<div class="box"><b style="color:var(--ink)">${esc(r.state)}</b></div>`:''}${r.outcome
      ?`<div class="box">${esc(r.outcome)}<code>${esc(r.outcome_evidence||'')}</code></div>`
      :`<div class="box w">поведение не описано ни в коде, ни в спеке</div>`}</div>
    ${r.reachable===false?`<div class="sec"><h4>путь</h4>
      <div class="box">не достигается ни одной цепочкой событий — лишний параметр или забытый переход</div></div>`
     :r.path?`<div class="sec"><h4>путь от начального состояния · ${r.path.length}</h4>
      ${r.path.length?r.path.map((p,i)=>`<div class="step"><span class="no">${i+1}</span>
        <span class="ev">${esc(p.event)}</span><span></span>
        <span class="ch">${Object.entries(p.changes).map(([k,[a,b]])=>
          `${esc(k)}: <s>${esc(a)}</s> → <i>${esc(b)}</i>`).join('<br>')}</span>
        <span></span><span class="wh">${esc(p.evidence)}</span></div>`).join('')
       :'<div class="box">это и есть начальное состояние</div>'}</div>`:''}
    ${r.rules.length?`<div class="sec"><h4>схлопнуто по правилам</h4>${r.rules.map(x=>
      `<div class="box" style="margin-bottom:8px">${esc(x.rule)}<code>${esc(x.evidence)}</code></div>`).join('')}</div>`:''}
    <div class="sec"><h4>ответ</h4>
      <button class="act" data-o="described">поведение корректно</button>
      <button class="act" data-o="contradictory">противоречие</button></div>`;
  sc.onclick=()=>{S.sel=null;render()};
  dr.querySelectorAll('[data-o]').forEach(b=>b.onclick=async()=>{b.textContent='…';
    await fetch('/answer',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({section:'outcomes',id:r.key,value:b.dataset.o})});
    b.textContent='сохранено'});
}
addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sel){S.sel=null;render()}});
const es=new EventSource('/events');
es.onmessage=()=>{const y=scrollY;load().then(()=>scrollTo(0,y))};
es.onerror=()=>$('live').className='live off';
es.onopen=()=>$('live').className='live';
load();
</script>
</body></html>
